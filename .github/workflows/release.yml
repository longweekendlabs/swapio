name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish, for example v0.4.3"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  linux-rpm:
    name: Linux x86_64 RPM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - name: Install rpmbuild and the Qt runtime PyInstaller needs to import
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            rpm libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0

      # build_rpm.sh reads the version through .venv and uses it to create the
      # packaging venv. It needs no dependencies of its own.
      - name: Prepare the version venv
        run: python -m venv .venv

      - name: Build the GPU RPM
        run: ./packaging/build_rpm.sh --gpu

      - name: Run the test suite against the packaged dependencies
        env:
          QT_QPA_PLATFORM: offscreen
        run: .package-gpu-venv/bin/python -m unittest discover -s tests -v

      - name: Extract the release notes for this version
        id: notes
        run: |
          version="$(.venv/bin/python -c 'from version import VERSION; print(VERSION)')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          awk -v v="## $version" '
            $0 ~ "^"v { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "No CHANGELOG section for $version" >&2; exit 1; }
          cat release-notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Swapio ${{ steps.notes.outputs.version }}" \
            --notes-file release-notes.md \
            dist/*.rpm
