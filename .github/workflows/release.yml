name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish, for example v0.4.3"
        required: true

permissions:
  contents: write
  # Deleting this run's own artifacts needs actions:write; contents:write is not
  # enough and the API answers 403 without it.
  actions: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # onnxruntime-gpu publishes x86_64 wheels only, so the ARM package is
          # the CPU profile. Neither package contains CUDA: ONNX Runtime binds to
          # whatever the machine already has and falls back to CPU without it.
          - arch: x86_64
            runner: ubuntu-24.04
            profile: gpu
            rpm_flags: "--gpu"
          - arch: aarch64
            runner: ubuntu-24.04-arm
            profile: cpu
            rpm_flags: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h /

      - name: Install packaging tools and the Qt runtime PyInstaller imports
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            rpm dpkg-dev file desktop-file-utils zsync \
            libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0

      # build_rpm.sh reads the version through .venv and uses it to create the
      # packaging venv. It needs no dependencies of its own.
      - name: Prepare the version venv
        run: python -m venv .venv

      - name: Build the bundle and the RPM
        run: ./packaging/build_rpm.sh ${{ matrix.rpm_flags }}

      - name: Run the test suite against the packaged dependencies
        env:
          QT_QPA_PLATFORM: offscreen
        run: .package-${{ matrix.profile }}-venv/bin/python -m unittest discover -s tests -v

      - name: Build the DEB
        run: ./packaging/build_deb.sh

      - name: Build the AppImage
        run: ./packaging/build_appimage.sh

      # The x86_64 RPM carries a -gpu suffix because build_rpm.sh can also make a
      # CPU-only one. Only one package per architecture is published, and it runs
      # with or without a GPU, so the suffix would only make people choose.
      - name: Normalise the asset names
        run: |
          version="$(.venv/bin/python -c 'from version import VERSION; print(VERSION)')"
          if [ -f "dist/swapio-${version}-1-${{ matrix.arch }}-gpu.rpm" ]; then
            mv "dist/swapio-${version}-1-${{ matrix.arch }}-gpu.rpm" \
               "dist/swapio-${version}-1-${{ matrix.arch }}.rpm"
          fi
          ls -lh dist/*.rpm dist/*.deb dist/*.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          retention-days: 1
          if-no-files-found: error
          path: |
            dist/*.rpm
            dist/*.deb
            dist/*.AppImage

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: Extract the release notes for this version
        id: notes
        run: |
          version="$(python -c 'from version import VERSION; print(VERSION)')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          awk -v v="## $version" '
            $0 ~ "^"v { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "No CHANGELOG section for $version" >&2; exit 1; }
          cat release-notes.md
          ls -lh packages/

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Swapio ${{ steps.notes.outputs.version }}" \
            --notes-file release-notes.md \
            packages/*

      # Release assets are free; workflow artifacts are not. They only existed to
      # carry packages between the two architecture jobs.
      - name: Delete the build artifacts
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[].id' |
          while read -r id; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" && echo "deleted $id"
          done
